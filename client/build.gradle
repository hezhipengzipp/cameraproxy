plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.cameraproxy.client'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.cameraproxy.client"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            storeFile file(project.findProperty('SIGNING_STORE_FILE') ?: rootProject.file('camera.jks'))
            storePassword project.findProperty('SIGNING_STORE_PASSWORD') ?: 'hello666'
            keyAlias project.findProperty('SIGNING_KEY_ALIAS') ?: 'zippsun'
            keyPassword project.findProperty('SIGNING_KEY_PASSWORD') ?: 'hello666'
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        aidl true
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation project(':aidl')
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
}
